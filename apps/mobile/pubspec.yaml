name: bombario
description: Bombario mobile client (Flutter + Flame). Renders the bombario_core simulation and handles touch input.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.20.0
  bombario_core:
    path: ../../packages/bombario_core
  bombario_net:
    path: ../../packages/bombario_net
  bonsoir: ^7.1.5
  flame_audio: ^2.12.2
  shared_preferences: ^2.5.5
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
  fonts:
    # Both fonts are SIL Open Font License; licences sit next to the files.
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
    - family: Silkscreen
      fonts:
        - asset: assets/fonts/Silkscreen-Regular.ttf
        - asset: assets/fonts/Silkscreen-Bold.ttf
          weight: 700
