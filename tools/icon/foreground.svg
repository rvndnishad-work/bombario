<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <!-- Adaptive icon foreground: 108x108 canvas, art inside the central
       66dp circle launchers never crop (33 from the centre; the spark
       reaches 32.5). Background is background.svg. -->
  <defs>
    <radialGradient id="body" cx="0.36" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#5a6a9a"/>
      <stop offset="0.35" stop-color="#2c3557"/>
      <stop offset="0.8" stop-color="#151a2c"/>
      <stop offset="1" stop-color="#0d1120"/>
    </radialGradient>
    <radialGradient id="rim" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.82" stop-color="#4b7bff" stop-opacity="0"/>
      <stop offset="1" stop-color="#7fa2ff" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9cfdd"/>
      <stop offset="0.5" stop-color="#7d869c"/>
      <stop offset="1" stop-color="#3a4050"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#fff3a6"/>
      <stop offset="0.55" stop-color="#ff9d1f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7a3a00" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7a3a00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eye" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e2f5"/>
    </radialGradient>
  </defs>
  <g transform="translate(54 54) scale(1.05) translate(-54 -54)">
  <!-- ground shadow -->
  <ellipse cx="52" cy="83" rx="21" ry="4" fill="url(#shadow)"/>
  <!-- fuse -->
  <path d="M63 40 C 66 35, 70.5 36.5, 70 33" fill="none" stroke="#3b2a14" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M63 40 C 66 35, 70.5 36.5, 70 33" fill="none" stroke="#c98f1c" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="1.6 1.4"/>
  <!-- cap -->
  <g transform="rotate(38 61 43)">
    <rect x="55.5" y="37.5" width="11" height="8" rx="2" fill="url(#cap)"/>
    <rect x="55.5" y="37.5" width="11" height="2.2" rx="1.1" fill="#ffffff" opacity="0.45"/>
  </g>
  <!-- body -->
  <circle cx="51" cy="61" r="22" fill="url(#body)"/>
  <circle cx="51" cy="61" r="22" fill="url(#rim)"/>
  <!-- specular -->
  <ellipse cx="42" cy="50" rx="7.5" ry="4.8" transform="rotate(-35 42 50)" fill="#ffffff" opacity="0.55"/>
  <ellipse cx="38.5" cy="54.5" rx="1.8" ry="1.4" fill="#ffffff" opacity="0.7"/>
  <!-- eyes -->
  <ellipse cx="46" cy="62" rx="4.2" ry="5.6" fill="url(#eye)"/>
  <ellipse cx="57" cy="62" rx="4.2" ry="5.6" fill="url(#eye)"/>
  <ellipse cx="47.2" cy="62.8" rx="2.3" ry="3.4" fill="#0b0e18"/>
  <ellipse cx="58.2" cy="62.8" rx="2.3" ry="3.4" fill="#0b0e18"/>
  <circle cx="46.4" cy="61" r="1" fill="#ffffff"/>
  <circle cx="57.4" cy="61" r="1" fill="#ffffff"/>
  <!-- cheeks -->
  <ellipse cx="41" cy="70" rx="3" ry="1.6" fill="#ff5a8a" opacity="0.45"/>
  <ellipse cx="62" cy="70" rx="3" ry="1.6" fill="#ff5a8a" opacity="0.45"/>
  <!-- spark -->
  <circle cx="70" cy="33" r="6.5" fill="url(#glow)"/>
  <path d="M70 27.5 L71.1 31.9 L75.5 33 L71.1 34.1 L70 38.5 L68.9 34.1 L64.5 33 L68.9 31.9 Z" fill="#fff8d0"/>
  <path d="M70 30 L70.6 32.4 L73 33 L70.6 33.6 L70 36 L69.4 33.6 L67 33 L69.4 32.4 Z" fill="#ffffff"/>
  </g>
</svg>
